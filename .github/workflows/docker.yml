name: docker

# The image this fork exists for: kite with serve --cache, published
# twice over — to Docker Hub, from the repository's DOCKERHUB_USERNAME
# and DOCKERHUB_TOKEN secrets, and to GitHub's own registry, which the
# GITHUB_TOKEN already reaches, so the Packages tab of this repository
# holds the image even before any secret is set. The build is the
# upstream's own recipe: the image compiles its own binary, stamped with
# this commit, for both architectures.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Describe the build
        run: |
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "DATE=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      # arm64 is not a nice-to-have here: a small server and a Raspberry Pi
      # are exactly what a site like this runs on.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ env.USERNAME != '' && env.TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.USERNAME }}
          password: ${{ env.TOKEN }}

      - name: Log in to GitHub's registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The images this build is
        id: images
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          if [ -n "$USERNAME" ]; then
            echo "$USERNAME/kite" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=git-
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ env.COMMIT }}
            DATE=${{ env.DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
