name: docker

# The image this fork exists for: kite with serve --cache, published to
# Docker Hub so the server pulls it like any other image. The build is
# the upstream's own recipe — the image compiles its own binary, stamped
# with this commit — with the registry pointed at Docker Hub and the
# account taken from the repository's secrets.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    name: Container image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Describe the build
        run: |
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "DATE=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      # arm64 is not a nice-to-have here: a small server and a Raspberry Pi
      # are exactly what a site like this runs on.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/kite
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=git-
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ env.COMMIT }}
            DATE=${{ env.DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
